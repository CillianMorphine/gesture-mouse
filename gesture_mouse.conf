# gesture_mouse.conf
# Конфігураційний файл GestureMouse
# Рядки, що починаються на '#', ігноруються.
#
# Пріоритет визначення рівня логування:
#   1. аргумент командного рядка --log-level=<рівень>  (найвищий)
#   2. значення log_level у цьому файлі
#   3. змінна оточення GESTURE_LOG_LEVEL                (найнижчий)
#
# Допустимі рівні: trace | debug | info | warn | error | critical

# ── Логування ───────────────────────────────────────────────────────────────
log_level = info

# ── Файлові логи ─────────────────────────────────────────────────────────────
# Директорія для збереження файлів логів (відносно директорії запуску)
log_dir = logs

# Максимальний розмір одного лог-файлу (МБ).
# Після досягнення ліміту файл ротується: gesture_mouse.log → gesture_mouse.1.log
log_max_size_mb = 5

# Кількість збережених ротаційних файлів (0 = без ліміту)
log_max_files = 10

# ── Камера ───────────────────────────────────────────────────────────────────
camera_index = 0
camera_width = 1280
camera_height = 720

# ── Розпізнавання жестів ─────────────────────────────────────────────────────
# Мінімальна впевненість класифікатора для прийняття жесту (0.0 – 1.0)
gesture_confidence_threshold = 0.60

# ── Локалізація ──────────────────────────────────────────────────────────────
# Мова повідомлень для користувача: uk | en
language = uk
